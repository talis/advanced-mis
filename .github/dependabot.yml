# Managed centrally: replaces Renovate. Security updates are enabled org-wide via GitHub code security configuration.
version: 2
updates:
  - package-ecosystem: "bundler"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      bundler-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      bundler-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      bundler-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
